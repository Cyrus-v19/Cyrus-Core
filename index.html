<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyrus AI</title>

<!-- Markdown & Syntax Highlighting Libraries -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

<!-- PDF Parsing Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0D1117;
    --sidebar: #111827;
    --bubble-bot: #1F2937;
    --bubble-user: #2563EB;
    --text-primary: #F9FAFB;
    --text-secondary: #9CA3AF;
    --accent: #10A37F;
    --border: #374151;
  }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text-primary);
    height: 100dvh; display: flex; flex-direction: column;
    overflow: hidden; position: fixed; width: 100%; top: 0; left: 0;
  }
  #header {
    padding: 16px; background: var(--sidebar); text-align: center;
    font-weight: 600; font-size: 17px; letter-spacing: 0.3px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-shrink: 0; position: relative;
  }
  #header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  #settingsBtn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; background: transparent; color: var(--text-secondary);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation; transition: transform 0.2s ease;
  }
  #settingsBtn:hover { transform: translateY(-50%) rotate(30deg); color: var(--text-primary); }
  
  #chat {
    flex: 1; overflow-y: auto; padding: 16px 12px;
    display: flex; flex-direction: column; gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    padding: 12px 16px; border-radius: 16px;
    max-width: 85%; line-height: 1.5; font-size: 15px;
    word-wrap: break-word; animation: fadeIn 0.25s ease-in-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  
  .user { background: var(--bubble-user); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot { background: var(--bubble-bot); color: var(--text-primary); margin-right: auto; border-bottom-left-radius: 4px; }
  
  /* Markdown styling inside bot messages */
  .bot p { margin-bottom: 8px; }
  .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 8px 0 8px 20px; }
  .bot h1, .bot h2, .bot h3 { margin: 12px 0 6px 0; font-size: 1.1em; }
  .bot code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 14px; }
  .bot pre { background: #000; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
  .bot pre code { background: none; padding: 0; }

  .msg.searching { color: var(--text-secondary); font-style: italic; font-size: 14px; background: transparent; border: 1px dashed var(--border); }
  
  /* Image Gallery inside user messages */
  .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; margin-top: 8px; }
  .img-grid img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; }

  /* Links & Source citations */
  .linkList { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .linkList a { display: block; color: var(--accent); font-size: 13px; margin-top: 4px; text-decoration: none; word-break: break-all; }

  /* Dynamic Follow-up Chips */
  .followups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    background: rgba(16, 163, 127, 0.15); border: 1px solid var(--accent); color: var(--accent);
    padding: 6px 12px; border-radius: 16px; font-size: 13px; cursor: pointer;
    transition: all 0.2s ease;
  }
  .chip:hover { background: var(--accent); color: white; transform: translateY(-1px); }

  /* Attachments Preview Panel */
  #attachmentsPreview {
    display: none; padding: 10px 12px; background: var(--sidebar);
    border-top: 1px solid var(--border); flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .preview-card {
    position: relative; display: flex; align-items: center; gap: 6px;
    background: var(--bg); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 12px;
  }
  .preview-card img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; }
  .preview-card .remove { cursor: pointer; color: var(--text-secondary); font-weight: bold; margin-left: 4px; }
  .preview-card .remove:hover { color: #EF4444; }

  /* Input Bar */
  #inputRow {
    display: flex; align-items: center; padding: 12px; gap: 8px;
    background: var(--sidebar); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #textInput {
    flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-primary); font-size: 15px; outline: none;
    transition: border-color 0.2s;
  }
  #textInput:focus { border-color: var(--accent); }
  .iconBtn {
    border: none; border-radius: 50%; width: 42px; height: 42px;
    background: var(--bubble-user); color: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer; transition: all 0.2s ease;
    touch-action: manipulation;
  }
  .iconBtn:hover { transform: scale(1.05); }
  .iconBtn:active { transform: scale(0.95); opacity: 0.8; }
  .iconBtn.secondary { background: var(--bubble-bot); border: 1px solid var(--border); }
  .iconBtn.listening { background: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 163, 127, 0.6); } 70% { box-shadow: 0 0 0 10px rgba(16, 163, 127, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 163, 127, 0); } }
  .iconBtn svg { width: 19px; height: 19px; pointer-events: none; }

  /* Modal Setup */
  #setup {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(13, 17, 23, 0.95); z-index: 100;
    display: none; flex-direction: column; justify-content: center; align-items: center; padding: 24px;
  }
  .setup-card { background: var(--sidebar); border: 1px solid var(--border); padding: 24px; border-radius: 16px; width: 100%; max-width: 360px; }
  .setup-card p { color: var(--text-secondary); margin-bottom: 8px; font-size: 14px; }
  .setup-card input {
    width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text-primary); font-size: 14px; outline: none;
  }
  .setup-card button {
    width: 100%; border-radius: 8px; padding: 12px; border: none;
    background: var(--accent); color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
  }
  .setup-card .closeBtn { background: var(--bubble-bot); border: 1px solid var(--border); }
</style>
</head>
<body>

<div id="header">
  <span class="dot"></span>Cyrus Workstation
  <button id="settingsBtn" onclick="openSettings()" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<div id="setup">
  <div class="setup-card">
    <h3 style="margin-bottom: 12px;">Settings</h3>
    <p>Groq API key (free)</p>
    <input type="text" id="apiKeyInput" placeholder="gsk_...">
    <p>Serper API key (free, for deep search)</p>
    <input type="text" id="serperKeyInput" placeholder="your serper key">
    <button onclick="saveKey()">Save Keys</button>
    <button class="closeBtn" onclick="closeSettings()">Cancel</button>
  </div>
</div>

<div id="chat"></div>

<div id="attachmentsPreview"></div>

<div id="inputRow">
  <!-- Image Upload Button -->
  <input type="file" id="imageInput" accept="image/*" multiple style="display:none;" onchange="handleImageSelect(event)">
  <button class="iconBtn secondary" onclick="document.getElementById('imageInput').click()" title="Upload Images (Up to 6)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>

  <!-- PDF / Document Upload Button -->
  <input type="file" id="pdfInput" accept="application/pdf,.txt" style="display:none;" onchange="handleDocumentSelect(event)">
  <button class="iconBtn secondary" onclick="document.getElementById('pdfInput').click()" title="Upload Document / PDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
  </button>

  <!-- Mic Button -->
  <button class="iconBtn secondary" id="micBtn" onclick="startVoice()" title="Voice input">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>

  <input type="text" id="textInput" placeholder="Ask Cyrus, analyze files, or deep search...">
  
  <button class="iconBtn" onclick="sendText()" title="Send">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script>
let mem = JSON.parse(localStorage.getItem('cyrus_mem')) || { name: null, history: [] };
let pendingImages = []; // Stores base64 images
let pendingDocText = ""; // Stores extracted PDF text
let pendingDocName = "";

function saveMem() { localStorage.setItem('cyrus_mem', JSON.stringify(mem)); }
function getKey() { return localStorage.getItem('cyrus_key'); }
function getSerperKey() { return localStorage.getItem('cyrus_serper_key'); }

function openSettings() {
  document.getElementById('apiKeyInput').value = getKey() || '';
  document.getElementById('serperKeyInput').value = getSerperKey() || '';
  document.getElementById('setup').style.display = 'flex';
}
function closeSettings() { document.getElementById('setup').style.display = 'none'; }

function saveKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  const sk = document.getElementById('serperKeyInput').value.trim();
  if (k) localStorage.setItem('cyrus_key', k);
  if (sk) localStorage.setItem('cyrus_serper_key', sk);
  document.getElementById('setup').style.display = 'none';
}

window.onload = function() {
  if (!getKey()) openSettings();
  mem.history.forEach(m => {
    if (typeof m.content === 'string') appendMsg(m.role === 'user' ? 'user' : 'bot', m.content);
  });
};

/* Attachments Handler */
function handleImageSelect(e) {
  const files = Array.from(e.target.files).slice(0, 6);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(evt) {
      pendingImages.push(evt.target.result);
      renderPreviews();
    };
    reader.readAsDataURL(file);
  });
}

async function handleDocumentSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  pendingDocName = file.name;

  if (file.type === "application/pdf") {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let text = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(item => item.str).join(" ") + "\n";
    }
    pendingDocText = text;
  } else {
    pendingDocText = await file.text();
  }
  renderPreviews();
}

function renderPreviews() {
  const panel = document.getElementById('attachmentsPreview');
  panel.innerHTML = "";
  if (pendingImages.length === 0 && !pendingDocText) {
    panel.style.display = "none";
    return;
  }
  panel.style.display = "flex";
  
  pendingImages.forEach((img, idx) => {
    const card = document.createElement('div');
    card.className = "preview-card";
    card.innerHTML = `<img src="${img}"> Image ${idx+1} <span class="remove" onclick="removeImage(${idx})">×</span>`;
    panel.appendChild(card);
  });

  if (pendingDocText) {
    const card = document.createElement('div');
    card.className = "preview-card";
    card.innerHTML = `📄 ${pendingDocName} (${Math.round(pendingDocText.length/1000)}k chars) <span class="remove" onclick="removeDoc()">×</span>`;
    panel.appendChild(card);
  }
}

function removeImage(idx) { pendingImages.splice(idx, 1); renderPreviews(); }
function removeDoc() { pendingDocText = ""; pendingDocName = ""; renderPreviews(); }
function clearAttachments() { pendingImages = []; pendingDocText = ""; pendingDocName = ""; renderPreviews(); }

/* UI Messaging & Rendering */
function appendMsg(who, text, extraClass) {
  const div = document.createElement('div');
  div.className = 'msg ' + who + (extraClass ? ' ' + extraClass : '');
  if (who === 'bot') {
    div.innerHTML = marked.parse(text);
    div.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
  } else {
    div.textContent = text;
  }
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = 999999;
  return div;
}

function renderFollowups(suggestions) {
  if (!suggestions || !suggestions.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'followups';
  suggestions.forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = s;
    chip.onclick = () => { wrap.remove(); process(s); };
    wrap.appendChild(chip);
  });
  document.getElementById('chat').appendChild(wrap);
  document.getElementById('chat').scrollTop = 999999;
}

/* Deep Research Engine */
async function searchWeb(query) {
  const key = getSerperKey();
  if (!key) return null;
  const res = await fetch("https://google.serper.dev/search", {
    method: "POST",
    headers: { "X-API-KEY": key, "Content-Type": "application/json" },
    body: JSON.stringify({ q: query })
  });
  return await res.json();
}

async function runDeepResearch(userQuery) {
  const statusMsg = appendMsg('bot', 'Initiating Deep Research workflow...', 'searching');
  let searchResults = [];
  let links = [];

  // Step 1: Execute primary search
  statusMsg.textContent = `Deep Research Step 1/3: Searching web for "${userQuery}"...`;
  const primary = await searchWeb(userQuery);
  if (primary && primary.organic) {
    primary.organic.slice(0, 3).forEach(r => {
      searchResults.push(`${r.title}: ${r.snippet}`);
      links.push({ title: r.title, link: r.link });
    });
  }

  // Step 2: Execute targeted follow-up search
  statusMsg.textContent = `Deep Research Step 2/3: Cross-referencing & refining analysis...`;
  const secondary = await searchWeb(`${userQuery} details context data`);
  if (secondary && secondary.organic) {
    secondary.organic.slice(0, 2).forEach(r => {
      searchResults.push(`${r.title}: ${r.snippet}`);
      links.push({ title: r.title, link: r.link });
    });
  }

  statusMsg.textContent = `Deep Research Step 3/3: Synthesizing full research report...`;
  statusMsg.remove();
  
  return { context: searchResults.join("\n\n"), links: links };
}

/* Streaming Completion API Call */
async function streamCyrusResponse(messages, botDiv) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + getKey(), "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "openai/gpt-oss-120b",
      messages: messages,
      stream: true,
      max_tokens: 1200
    })
  });

  if (!res.ok) throw new Error("API stream connection error.");

  const reader = res.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let fullText = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value);
    const lines = chunk.split("\n");
    for (const line of lines) {
      if (line.startsWith("data: ") && line !== "data: [DONE]") {
        try {
          const parsed = JSON.parse(line.substring(6));
          const content = parsed.choices[0]?.delta?.content || "";
          fullText += content;
          botDiv.innerHTML = marked.parse(fullText);
          document.getElementById('chat').scrollTop = 999999;
        } catch (e) {}
      }
    }
  }

  botDiv.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
  return fullText;
}

/* Vision API Call (Multi-Image) */
async function analyzeMultipleImages(images, question) {
  const content = [{ type: "text", text: question || "Analyze and compare these uploaded images in detail." }];
  images.forEach(img => content.push({ type: "image_url", image_url: { url: img } }));

  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + getKey(), "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "qwen/qwen3.6-27b",
      messages: [{ role: "user", content: content }],
      max_tokens: 1000
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.choices[0].message.content;
}

/* Main Request Processor */
async function process(text) {
  if (!text.trim() && pendingImages.length === 0 && !pendingDocText) return;

  const currentText = text;
  const currentImages = [...pendingImages];
  const currentDoc = pendingDocText;
  clearAttachments();

  // Render User Message with images if attached
  const userDiv = document.createElement('div');
  userDiv.className = 'msg user';
  if (currentText) userDiv.appendChild(document.createTextNode(currentText));
  if (currentImages.length) {
    const grid = document.createElement('div');
    grid.className = 'img-grid';
    currentImages.forEach(img => {
      const el = document.createElement('img'); el.src = img; grid.appendChild(el);
    });
    userDiv.appendChild(grid);
  }
  document.getElementById('chat').appendChild(userDiv);
  document.getElementById('chat').scrollTop = 999999;

  // 1. Multi-Image Analysis Flow
  if (currentImages.length > 0) {
    const statusMsg = appendMsg('bot', `Analyzing ${currentImages.length} image(s)...`, 'searching');
    try {
      const reply = await analyzeMultipleImages(currentImages, currentText);
      statusMsg.remove();
      appendMsg('bot', reply);
      mem.history.push({ role: "user", content: currentText || "Image comparison" });
      mem.history.push({ role: "assistant", content: reply });
      saveMem();
    } catch (e) {
      statusMsg.remove();
      appendMsg('bot', "Vision processing failed: " + e.message);
    }
   return;
  }

  // 2. Text Stream & Deep Research Flow
  let systemPrompt = "You are Cyrus, a personal AI assistant. Be direct, clear, and well-structured in markdown format.";
  
  if (currentDoc) {
    systemPrompt += `\n\nUser uploaded a document. Extract insights from this text content:\n${currentDoc.slice(0, 12000)}`;
  }

  const isDeepResearch = currentText.toLowerCase().includes("research") || currentText.toLowerCase().includes("deep search") || currentText.toLowerCase().includes("compare");
  let searchLinks = [];

  if (isDeepResearch && getSerperKey()) {
    const research = await runDeepResearch(currentText);
    systemPrompt += `\n\nDeep Research Findings:\n${research.context}\nSynthesize these into a structured research answer.`;
    searchLinks = research.links;
  }

  const messages = [{ role: "system", content: systemPrompt }]
    .concat(mem.history.slice(-8))
    .concat([{ role: "user", content: currentText }]);

  const botDiv = appendMsg('bot', '');
  try {
    const finalReply = await streamCyrusResponse(messages, botDiv);
    
    // Add citations if available
    if (searchLinks.length) {
      const linkDiv = document.createElement('div');
      linkDiv.className = 'linkList';
      searchLinks.forEach(l => {
        const a = document.createElement('a'); a.href = l.link; a.textContent = "🔗 " + l.title; a.target = '_blank';
        linkDiv.appendChild(a);
      });
      botDiv.appendChild(linkDiv);
    }

    mem.history.push({ role: "user", content: currentText });
    mem.history.push({ role: "assistant", content: finalReply });
    saveMem();

    // Generate Follow-up chips
    renderFollowups([
      "Can you expand further on this?",
      "Summarize this in key bullet points",
      "What are the practical next steps?"
    ]);

  } catch (e) {
    botDiv.textContent = "Error streaming response: " + e.message;
  }
}

function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value;
  input.value = '';
  process(text);
}

document.getElementById('textInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendText();
});

function startVoice() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) { alert('Voice input is not supported in this browser.'); return; }
  const micBtn = document.getElementById('micBtn');
  const rec = new Recognition();
  rec.lang = 'en-US';
  micBtn.classList.add('listening');
  rec.onresult = (e) => { process(e.results[0][0].transcript); };
  rec.onend = () => micBtn.classList.remove('listening');
  rec.onerror = () => micBtn.classList.remove('listening');
  rec.start();
}
</script>

</body>
</html>
