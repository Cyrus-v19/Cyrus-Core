<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyrus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0D1117;
    --sidebar: #111827;
    --bubble-bot: #1F2937;
    --bubble-user: #2563EB;
    --text-primary: #F9FAFB;
    --text-secondary: #9CA3AF;
    --accent: #10A37F;
    --border: #374151;
  }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text-primary);
    height: 100dvh; display: flex; flex-direction: column;
    overflow: hidden;
    position: fixed; width: 100%; top: 0; left: 0;
  }
  #header {
    padding: 16px; background: var(--sidebar); text-align: center;
    font-weight: 600; font-size: 17px; letter-spacing: 0.3px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-shrink: 0; position: relative;
  }
  #header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  #settingsBtn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; background: transparent; color: var(--text-secondary);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation;
  }
  #settingsBtn svg { width: 20px; height: 20px; pointer-events: none; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px 12px;
    display: flex; flex-direction: column;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    margin: 6px 0; padding: 11px 15px; border-radius: 16px;
    max-width: 78%; line-height: 1.45; font-size: 15px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .user { background: var(--bubble-user); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot { background: var(--bubble-bot); color: var(--text-primary); margin-right: auto; border-bottom-left-radius: 4px; }
  .msg.searching { color: var(--text-secondary); font-style: italic; font-size: 14px; }
  .msg img { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
  .linkList { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .linkList a {
    display: block; color: var(--accent); font-size: 13px; margin-top: 6px;
    text-decoration: none; word-break: break-all;
  }
  #inputRow {
    display: flex; align-items: center; padding: 12px; gap: 6px;
    background: var(--sidebar); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #textInput {
    flex: 1; padding: 13px 16px; border-radius: 24px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-primary); font-size: 15px; outline: none;
    min-width: 0;
  }
  #textInput::placeholder { color: var(--text-secondary); }
  .iconBtn {
    border: none; border-radius: 50%; width: 44px; height: 44px;
    background: var(--bubble-user); color: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
    position: relative; z-index: 10;
    touch-action: manipulation;
  }
  .iconBtn:active { opacity: 0.75; }
  .iconBtn.mic { background: var(--bubble-bot); border: 1px solid var(--border); }
  .iconBtn.mic.listening { background: var(--accent); }
  .iconBtn.camera { background: var(--bubble-bot); border: 1px solid var(--border); }
  .iconBtn svg { width: 19px; height: 19px; pointer-events: none; }
  #imagePreview {
    display: none; padding: 10px 12px; background: var(--sidebar);
    border-top: 1px solid var(--border); align-items: center; gap: 10px;
  }
  #imagePreview img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
  #imagePreview span { color: var(--text-secondary); font-size: 13px; flex: 1; }
  #imagePreview button {
    background: none; border: none; color: var(--text-secondary); font-size: 20px;
    cursor: pointer; touch-action: manipulation;
  }
  #setup {
    padding: 24px; text-align: center; max-width: 340px; margin: auto;
    display: none; flex-direction: column;
  }
  #setup p { color: var(--text-secondary); margin-bottom: 8px; font-size: 15px; }
  #setup input {
    width: 100%; padding: 13px; margin-bottom: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--sidebar); color: var(--text-primary);
    font-size: 15px; outline: none;
  }
  #setup button {
    width: 100%; border-radius: 10px; padding: 13px; border: none;
    background: var(--accent); color: white; font-size: 15px; font-weight: 600;
    touch-action: manipulation; margin-bottom: 12px;
  }
  #setup .closeBtn { background: var(--bubble-bot); border: 1px solid var(--border); }
  #setup label { display: block; margin-top: 16px; margin-bottom: 4px; color: var(--text-secondary); font-size: 13px; text-align: left; }
</style>
</head>
<body>

<div id="header">
  <span class="dot"></span>Cyrus
  <button id="settingsBtn" onclick="openSettings()" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<div id="setup">
  <label>Groq API key (free)</label>
  <input type="text" id="apiKeyInput" placeholder="gsk_...">
  <label>Serper API key (free, for web search)</label>
  <input type="text" id="serperKeyInput" placeholder="your serper key">
  <button onclick="saveKey()">Save</button>
  <button class="closeBtn" onclick="closeSettings()">Cancel</button>
</div>

<div id="chat"></div>

<div id="imagePreview">
  <img id="previewImg" src="">
  <span>Image ready to send</span>
  <button onclick="clearImage()">×</button>
</div>

<div id="inputRow">
  <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
  <button class="iconBtn camera" onclick="document.getElementById('fileInput').click()" title="Send image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>
  <button class="iconBtn mic" id="micBtn" onclick="startVoice()" title="Voice input">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <input type="text" id="textInput" placeholder="Message Cyrus...">
  <button class="iconBtn" onclick="sendText()" title="Send">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script>
let mem = JSON.parse(localStorage.getItem('cyrus_mem')) || {
  name: null, goals: [], projects: [], notes: [], tasks: [], history: []
};
let pendingImage = null;
let lastBotReply = null;

function saveMem() { localStorage.setItem('cyrus_mem', JSON.stringify(mem)); }
function getKey() { return localStorage.getItem('cyrus_key'); }
function getSerperKey() { return localStorage.getItem('cyrus_serper_key'); }

function openSettings() {
  document.getElementById('apiKeyInput').value = getKey() || '';
  document.getElementById('serperKeyInput').value = getSerperKey() || '';
  document.getElementById('setup').style.display = 'flex';
}
function closeSettings() { document.getElementById('setup').style.display = 'none'; }

function saveKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  const sk = document.getElementById('serperKeyInput').value.trim();
  if (k) localStorage.setItem('cyrus_key', k);
  if (sk) localStorage.setItem('cyrus_serper_key', sk);
  document.getElementById('setup').style.display = 'none';
}

window.onload = function() {
  if (!getKey()) document.getElementById('setup').style.display = 'flex';
  mem.history.forEach(m => {
    if (typeof m.content === 'string') {
      appendMsg(m.role === 'user' ? 'user' : 'bot', m.content);
      if (m.role === 'assistant') lastBotReply = m.content;
    }
  });
};

function appendMsg(who, text, extraClass) {
  const div = document.createElement('div');
  div.className = 'msg ' + who + (extraClass ? ' ' + extraClass : '');
  div.textContent = text;
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = 999999;
  if (who === 'bot' && !extraClass) lastBotReply = text;
  return div;
}

function appendMsgWithLinks(who, text, links) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  if (links && links.length) {
    const linkDiv = document.createElement('div');
    linkDiv.className = 'linkList';
    links.forEach(l => {
      const a = document.createElement('a');
      a.href = l.link; a.textContent = l.title; a.target = '_blank';
      linkDiv.appendChild(a);
    });
    div.appendChild(linkDiv);
  }
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = 999999;
  if (who === 'bot') lastBotReply = text;
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(u);
}

function handleBuiltin(text) {
  const t = text.toLowerCase().trim();
  if (t.startsWith('remember my name is')) {
    mem.name = text.slice(20).trim(); saveMem();
    return 'Got it, ' + mem.name + '.';
  }
  if (t.startsWith('add goal ')) { mem.goals.push(text.slice(9)); saveMem(); return 'Goal added.'; }
  if (t.startsWith('add project ')) { mem.projects.push(text.slice(12)); saveMem(); return 'Project added.'; }
  if (t.startsWith('add note ')) { mem.notes.push(text.slice(9)); saveMem(); return 'Note saved.'; }
  if (t.startsWith('add task ')) { mem.tasks.push(text.slice(9)); saveMem(); return 'Task added.'; }
  if (t === 'show memory') { return JSON.stringify(mem, null, 2); }
  if (t === 'save this') {
    if (!lastBotReply) return "There's nothing recent to save yet.";
    mem.notes.push(lastBotReply);
    saveMem();
    return 'Saved that as a note.';
  }
  return null;
}

function handleImageSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    pendingImage = e.target.result;
    document.getElementById('previewImg').src = pendingImage;
    document.getElementById('imagePreview').style.display = 'flex';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  pendingImage = null;
  document.getElementById('imagePreview').style.display = 'none';
  document.getElementById('fileInput').value = '';
}

async function analyzeImage(imageDataUrl, question) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + getKey(), "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "qwen/qwen3.6-27b",
      messages: [{
        role: "user",
        content: [
          { type: "text", text: question || "Describe what you see in this image in detail." },
          { type: "image_url", image_url: { url: imageDataUrl } }
        ]
      }],
      max_tokens: 700
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.choices[0].message.content;
}

async function searchWeb(query) {
  const serperKey = getSerperKey();
  if (!serperKey) return null;
  const res = await fetch("https://google.serper.dev/search", {
    method: "POST",
    headers: { "X-API-KEY": serperKey, "Content-Type": "application/json" },
    body: JSON.stringify({ q: query })
  });
  return await res.json();
}

async function askCyrus(text, searchContext) {
  let systemPrompt = 'You are Cyrus, a personal AI assistant built specifically for Samuel. ' +
    'You were created by Samuel using free AI tools. You are NOT ChatGPT, NOT OpenAI\'s assistant, and NOT ' +
    'affiliated with OpenAI, Google, or any other company as a product. If asked who made you, who developed you, ' +
    'or what you are, always say: "I\'m Cyrus, a personal assistant Samuel built for himself." Never mention ' +
    'the underlying model name, OpenAI, or any AI company by name, even if directly asked what model you run on. ' +
    '\nName: ' + mem.name +
    '\nGoals: ' + JSON.stringify(mem.goals) +
    '\nProjects: ' + JSON.stringify(mem.projects) +
    '\nNotes: ' + JSON.stringify(mem.notes) +
    '\nTasks: ' + JSON.stringify(mem.tasks) +
    '\nBe concise and direct. You DO have access to live internet search — when the user asks about current ' +
    'events, news, prices, scores, or anything time-sensitive, a web search happens automatically before you answer, ' +
    'and results are provided to you below when relevant. Never say you lack internet access or that you cannot ' +
    'get real-time information — you can, through this search capability. If no search results are included below ' +
    'and the question needs current info, simply note the search didn\'t return results this time, not that you\'re incapable of searching. ' +
    'If asked what you can do, describe yourself as able to: chat and remember context, search the live web for current ' +
    'information, analyze images, remember notes/goals/projects/tasks, and hold natural conversation. Never describe ' +
    'yourself using generic AI assistant boilerplate, and never mention training cutoffs as a limitation since your ' +
    'search capability compensates for that.';

  if (searchContext) {
    systemPrompt += '\n\nYou just searched the web and found this current information:\n' + searchContext +
      '\n\nUse this information to answer accurately. Mention it\'s from a live web search.';
  }

  const messages = [{role:"system", content: systemPrompt}]
    .concat(mem.history.filter(m => typeof m.content === 'string').slice(-10))
    .concat([{role:"user", content: text}]);

  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + getKey(), "Content-Type": "application/json" },
    body: JSON.stringify({ model: "openai/gpt-oss-120b", messages: messages, max_tokens: 900 })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const reply = data.choices[0].message.content;
  mem.history.push({role:"user", content:text});
  mem.history.push({role:"assistant", content:reply});
  saveMem();
  return reply;
}

async function runSearch(query) {
  if (!getSerperKey()) return { text: null, links: null, error: "No Serper key set." };
  try {
    const results = await searchWeb(query);
    let parts = [];
    let links = null;
    if (results) {
      if (results.answerBox) parts.push('Direct answer: ' + (results.answerBox.answer || results.answerBox.snippet || ''));
      if (results.organic) {
        parts.push(results.organic.slice(0, 5).map(r => r.title + ': ' + r.snippet).join('\n\n'));
        links = results.organic.slice(0, 5).map(r => ({title: r.title, link: r.link}));
      }
    }
    return { text: parts.join('\n\n'), links: links, error: null };
  } catch (e) {
    return { text: null, links: null, error: e.message };
  }
}

async function runMorningCheck() {
  const loadingMsg = appendMsg('bot', 'Pulling today\'s football fixtures...', 'searching');
  const result = await runSearch("football fixtures today");
  loadingMsg.remove();
  if (result.error) {
    appendMsg('bot', 'Could not fetch fixtures: ' + result.error);
    return;
  }
  mem.notes.push('Morning check run - ' + new Date().toDateString());
  saveMem();
  const reply = await askCyrus("Give me a short, friendly morning summary of today's football fixtures based on this search data, then remind me of my current tasks.", result.text);
  appendMsgWithLinks('bot', reply, result.links);
  speak(reply);
}

async function runDailyBrief() {
  const loadingMsg = appendMsg('bot', 'Putting your daily brief together...', 'searching');
  const result = await runSearch("top news today");
  loadingMsg.remove();
  const dateStr = new Date().toDateString();
  const taskList = mem.tasks.length ? mem.tasks.join(', ') : 'no tasks saved right now';
  const prompt = "Give me a short daily brief. Today is " + dateStr + ". My current tasks are: " + taskList +
    ". Include a quick summary of today's top news from the search data, then list my tasks clearly.";
  const reply = await askCyrus(prompt, result.text);
  appendMsgWithLinks('bot', reply, result.links);
  speak(reply);
}

async function process(text) {
  if (!text.trim() && !pendingImage) return;

  if (pendingImage) {
    const imgDiv = document.createElement('div');
    imgDiv.className = 'msg user';
    if (text.trim()) imgDiv.appendChild(document.createTextNode(text));
    const imgEl = document.createElement('img');
    imgEl.src = pendingImage;
    imgDiv.appendChild(imgEl);
    document.getElementById('chat').appendChild(imgDiv);
    document.getElementById('chat').scrollTop = 999999;

    const loadingMsg = appendMsg('bot', 'Looking at the image...', 'searching');
    try {
      const reply = await analyzeImage(pendingImage, text);
      loadingMsg.remove();
      appendMsg('bot', reply);
      speak(reply);
    } catch (e) {
      loadingMsg.remove();
      appendMsg('bot', 'Image analysis failed: ' + e.message);
    }
    clearImage();
    return;
  }

  appendMsg('user', text);

  const t = text.toLowerCase().trim();

  if (t === 'morning check') { await runMorningCheck(); return; }
  if (t === 'daily brief') { await runDailyBrief(); return; }

  const builtin = handleBuiltin(text);
  if (builtin) { appendMsg('bot', builtin); speak(builtin); return; }

  let searchContext = null;
  let links = null;

  const needsSearch = t.startsWith('search ') || t.startsWith('search:') ||
    /\b(today|latest|current|currently|now|this week|this year|recent|202[4-9]|who is the|what is the current)\b/.test(t);

  if (needsSearch) {
    if (!getSerperKey()) {
      appendMsg('bot', "I don't have web search set up. Tap the gear icon and add your Serper API key.");
      return;
    }
    const query = text.replace(/^search:?\s*/i, '');
    const loadingMsg = appendMsg('bot', 'Searching the web...', 'searching');
    const result = await runSearch(query);
    loadingMsg.remove();
    if (result.error) {
      appendMsg('bot', 'Search failed: ' + result.error);
      return;
    }
    searchContext = result.text;
    links = result.links;
  }

  try {
    const reply = await askCyrus(text, searchContext);
    appendMsgWithLinks('bot', reply, links);
    speak(reply);
  } catch (e) {
    appendMsg('bot', 'Something went wrong: ' + e.message);
  }
}

function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value;
  input.value = '';
  process(text);
}

document.getElementById('textInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendText();
});

function startVoice() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) { alert('Voice not supported on this browser'); return; }
  const micBtn = document.getElementById('micBtn');
  const rec = new Recognition();
  rec.lang = 'en-US';
  micBtn.classList.add('listening');
  rec.onresult = (e) => { process(e.results[0][0].transcript); };
  rec.onend = () => micBtn.classList.remove('listening');
  rec.onerror = () => micBtn.classList.remove('listening');
  rec.start();
}
</script>

</body>
</html>
