<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyrus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0D1117;
    --sidebar: #111827;
    --bubble-bot: #1F2937;
    --bubble-user: #2563EB;
    --text-primary: #F9FAFB;
    --text-secondary: #9CA3AF;
    --accent: #10A37F;
    --border: #374151;
  }
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text-primary);
    height: 100dvh; display: flex; flex-direction: column;
    overflow: hidden;
    position: fixed; width: 100%; top: 0; left: 0;
  }
  #header {
    padding: 16px; background: var(--sidebar); text-align: center;
    font-weight: 600; font-size: 17px; letter-spacing: 0.3px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-shrink: 0;
  }
  #header .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px 12px;
    display: flex; flex-direction: column;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    margin: 6px 0; padding: 11px 15px; border-radius: 16px;
    max-width: 78%; line-height: 1.45; font-size: 15px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .user {
    background: var(--bubble-user); color: white;
    margin-left: auto; border-bottom-right-radius: 4px;
  }
  .bot {
    background: var(--bubble-bot); color: var(--text-primary);
    margin-right: auto; border-bottom-left-radius: 4px;
  }
  .msg.searching {
    color: var(--text-secondary); font-style: italic; font-size: 14px;
  }
  #inputRow {
    display: flex; align-items: center; padding: 12px; gap: 8px;
    background: var(--sidebar); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #textInput {
    flex: 1; padding: 13px 16px; border-radius: 24px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-primary); font-size: 15px; outline: none;
  }
  #textInput::placeholder { color: var(--text-secondary); }
  .iconBtn {
    border: none; border-radius: 50%; width: 46px; height: 46px;
    background: var(--bubble-user); color: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
    position: relative; z-index: 10;
    touch-action: manipulation;
  }
  .iconBtn:active { opacity: 0.75; }
  .iconBtn.mic { background: var(--bubble-bot); border: 1px solid var(--border); }
  .iconBtn.mic.listening { background: var(--accent); }
  .iconBtn svg { width: 20px; height: 20px; pointer-events: none; }

  #setup {
    padding: 24px; text-align: center; max-width: 340px; margin: auto;
  }
  #setup p { color: var(--text-secondary); margin-bottom: 8px; font-size: 15px; }
  #setup input {
    width: 100%; padding: 13px; margin-bottom: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--sidebar); color: var(--text-primary);
    font-size: 15px; outline: none;
  }
  #setup button {
    width: 100%; border-radius: 10px; padding: 13px; border: none;
    background: var(--accent); color: white; font-size: 15px; font-weight: 600;
    touch-action: manipulation;
    margin-bottom: 20px;
  }
  #setup label { display: block; margin-top: 16px; margin-bottom: 4px; color: var(--text-secondary); font-size: 13px; text-align: left; }
</style>
</head>
<body>

<div id="header"><span class="dot"></span>Cyrus</div>

<div id="setup" style="display:none;">
  <label>Groq API key (free)</label>
  <input type="text" id="apiKeyInput" placeholder="gsk_...">
  <label>Serper API key (free, for web search)</label>
  <input type="text" id="serperKeyInput" placeholder="your serper key">
  <button onclick="saveKey()">Save & Start</button>
</div>

<div id="chat"></div>

<div id="inputRow">
  <button class="iconBtn mic" id="micBtn" onclick="startVoice()" title="Voice input">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <input type="text" id="textInput" placeholder="Message Cyrus...">
  <button class="iconBtn" onclick="sendText()" title="Send">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script>
let mem = JSON.parse(localStorage.getItem('cyrus_mem')) || {
  name: null, goals: [], projects: [], notes: [], tasks: [], history: []
};

function saveMem() {
  localStorage.setItem('cyrus_mem', JSON.stringify(mem));
}

function getKey() { return localStorage.getItem('cyrus_key'); }
function getSerperKey() { return localStorage.getItem('cyrus_serper_key'); }

function saveKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  const sk = document.getElementById('serperKeyInput').value.trim();
  if (k) localStorage.setItem('cyrus_key', k);
  if (sk) localStorage.setItem('cyrus_serper_key', sk);
  if (k) document.getElementById('setup').style.display = 'none';
}

window.onload = function() {
  if (!getKey()) {
    document.getElementById('setup').style.display = 'flex';
  }
  mem.history.forEach(m => appendMsg(m.role === 'user' ? 'user' : 'bot', m.content));
};

function appendMsg(who, text, extraClass) {
  const div = document.createElement('div');
  div.className = 'msg ' + who + (extraClass ? ' ' + extraClass : '');
  div.textContent = text;
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = 999999;
  return div;
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(u);
}

function handleBuiltin(text) {
  const t = text.toLowerCase().trim();
  if (t.startsWith('remember my name is')) {
    mem.name = text.slice(20).trim(); saveMem();
    return 'Got it, ' + mem.name + '.';
  }
  if (t.startsWith('add goal ')) { mem.goals.push(text.slice(9)); saveMem(); return 'Goal added.'; }
  if (t.startsWith('add project ')) { mem.projects.push(text.slice(12)); saveMem(); return 'Project added.'; }
  if (t.startsWith('add note ')) { mem.notes.push(text.slice(9)); saveMem(); return 'Note saved.'; }
  if (t.startsWith('add task ')) { mem.tasks.push(text.slice(9)); saveMem(); return 'Task added.'; }
  if (t === 'show memory') { return JSON.stringify(mem, null, 2); }
  return null;
}

async function searchWeb(query) {
  const serperKey = getSerperKey();
  if (!serperKey) return null;
  const res = await fetch("https://google.serper.dev/search", {
    method: "POST",
    headers: {
      "X-API-KEY": serperKey,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ q: query })
  });
  const data = await res.json();
  return data;
}

async function askCyrus(text, searchContext) {
  let systemPrompt = 'You are Cyrus, Samuel\'s personal AI assistant.\nName: ' + mem.name +
    '\nGoals: ' + JSON.stringify(mem.goals) +
    '\nProjects: ' + JSON.stringify(mem.projects) +
    '\nNotes: ' + JSON.stringify(mem.notes) +
    '\nTasks: ' + JSON.stringify(mem.tasks) +
    '\nBe concise and direct.';

  if (searchContext) {
    systemPrompt += '\n\nYou just searched the web and found this current information:\n' + searchContext +
      '\n\nUse this information to answer the user\'s question accurately. Mention it\'s based on a live web search.';
  }

  const messages = [{role:"system", content: systemPrompt}]
    .concat(mem.history.slice(-10))
    .concat([{role:"user", content: text}]);

  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + getKey(),
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: messages,
      max_tokens: 900
    })
  });
  const data = await res.json();
  const reply = data.choices[0].message.content;
  mem.history.push({role:"user", content:text});
  mem.history.push({role:"assistant", content:reply});
  saveMem();
  return reply;
}

async function process(text) {
  if (!text.trim()) return;
  appendMsg('user', text);

  const builtin = handleBuiltin(text);
  if (builtin) {
    appendMsg('bot', builtin);
    speak(builtin);
    return;
  }

  const t = text.toLowerCase().trim();
  let searchContext = null;

  if (t.startsWith('search ') || t.startsWith('search:')) {
    if (!getSerperKey()) {
      appendMsg('bot', "I don't have web search set up yet. Add your Serper API key first.");
      return;
    }
    const query = text.replace(/^search:?\s*/i, '');
    const loadingMsg = appendMsg('bot', 'Searching the web...', 'searching');
    try {
      const results = await searchWeb(query);
      loadingMsg.remove();
      if (results) {
        let parts = [];
        if (results.answerBox) {
          parts.push('Direct answer: ' + (results.answerBox.answer || results.answerBox.snippet || ''));
        }
        if (results.organic) {
          parts.push(results.organic.slice(0, 5).map(r => r.title + ': ' + r.snippet).join('\n\n'));
        }
        searchContext = parts.join('\n\n');
      }
    } catch (e) {
      loadingMsg.remove();
      appendMsg('bot', 'Search failed: ' + e.message);
      return;
    }
  }

  const reply = await askCyrus(text, searchContext);
  appendMsg('bot', reply);
  speak(reply);
}

function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value;
  input.value = '';
  process(text);
}

document.getElementById('textInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendText();
});

function startVoice() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) { alert('Voice not supported on this browser'); return; }
  const micBtn = document.getElementById('micBtn');
  const rec = new Recognition();
  rec.lang = 'en-US';
  micBtn.classList.add('listening');
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    process(text);
  };
  rec.onend = () => micBtn.classList.remove('listening');
  rec.onerror = () => micBtn.classList.remove('listening');
  rec.start();
}
</script>

</body>
 </html>
