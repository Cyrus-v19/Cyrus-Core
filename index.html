<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyrus</title>

<!-- Markdown & Syntax Highlighting -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

<!-- PDF Parsing Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0D1117;
    --sidebar: #111827;
    --bubble-bot: #1F2937;
    --bubble-user: #2563EB;
    --text-primary: #F9FAFB;
    --text-secondary: #9CA3AF;
    --accent: #10A37F;
    --border: #374151;
  }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text-primary);
    height: 100dvh; display: flex; flex-direction: column;
    overflow: hidden; position: fixed; width: 100%; top: 0; left: 0;
  }
  #header {
    padding: 12px 16px; background: var(--sidebar); text-align: center;
    font-weight: 600; font-size: 16px; letter-spacing: 0.3px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-shrink: 0; position: relative;
  }
  #header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  
  #settingsBtn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; background: transparent; color: var(--text-secondary);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation; transition: transform 0.2s ease;
  }
  #settingsBtn svg { width: 20px; height: 20px; pointer-events: none; }
  #settingsBtn:hover { color: var(--text-primary); }
  
  #chat {
    flex: 1; overflow-y: auto; padding: 16px 12px;
    display: flex; flex-direction: column; gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    padding: 12px 16px; border-radius: 16px;
    max-width: 85%; line-height: 1.5; font-size: 15px;
    word-wrap: break-word; animation: fadeIn 0.2s ease-in-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  
  .user { background: var(--bubble-user); color: white; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot { background: var(--bubble-bot); color: var(--text-primary); margin-right: auto; border-bottom-left-radius: 4px; }
  
  .bot p { margin-bottom: 8px; }
  .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 8px 0 8px 20px; }
  .bot code { background: rgba(0,0,0,0.3); padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 13px; }
  .bot pre { background: #000; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
  .bot pre code { background: none; padding: 0; }

  .doc-tag {
    display: inline-block; background: rgba(255,255,255,0.2);
    padding: 4px 8px; border-radius: 6px; font-size: 12px; margin-bottom: 6px; font-weight: 500;
  }

  .msg.searching { color: var(--text-secondary); font-style: italic; font-size: 13px; background: transparent; border: 1px dashed var(--border); }
  
  .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; margin-top: 8px; }
  .img-grid img { width: 100%; height: 70px; object-fit: cover; border-radius: 6px; }

  .linkList { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .linkList a { display: block; color: var(--accent); font-size: 13px; margin-top: 4px; text-decoration: none; word-break: break-all; }

  .followups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    background: rgba(16, 163, 127, 0.15); border: 1px solid var(--accent); color: var(--accent);
    padding: 5px 10px; border-radius: 14px; font-size: 12px; cursor: pointer;
  }

  #attachmentsPreview {
    display: none; padding: 8px 12px; background: var(--sidebar);
    border-top: 1px solid var(--border); flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .preview-card {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 12px;
  }
  .preview-card img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
  .preview-card .remove { cursor: pointer; color: var(--text-secondary); font-weight: bold; margin-left: 4px; }

  #inputRow {
    display: flex; align-items: center; padding: 8px 10px; gap: 6px;
    background: var(--sidebar); border-top: 1px solid var(--border);
    flex-shrink: 0; width: 100%;
  }
  #textInput {
    flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-primary); font-size: 14px; outline: none;
    min-width: 0;
  }
  .iconBtn {
    border: none; border-radius: 50%; width: 38px; height: 38px;
    background: var(--bubble-user); color: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer; touch-action: manipulation;
  }
  .iconBtn.secondary { background: var(--bubble-bot); border: 1px solid var(--border); }
  .iconBtn.listening { background: var(--accent); }
  .iconBtn svg { width: 18px; height: 18px; pointer-events: none; }

  #setup {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(13, 17, 23, 0.95); z-index: 100;
    display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
  }
  .setup-card { background: var(--sidebar); border: 1px solid var(--border); padding: 20px; border-radius: 14px; width: 100%; max-width: 320px; }
  .setup-card p { color: var(--text-secondary); margin-bottom: 6px; font-size: 13px; }
  .setup-card input {
    width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text-primary); font-size: 13px; outline: none;
  }
  .setup-card button {
    width: 100%; border-radius: 8px; padding: 10px; border: none;
    background: var(--accent); color: white; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 6px;
  }
  .setup-card .closeBtn { background: var(--bubble-bot); border: 1px solid var(--border); }
</style>
</head>
<body>

<div id="header">
  <span class="dot"></span>Cyrus
  <button id="settingsBtn" onclick="openSettings()" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<div id="setup">
  <div class="setup-card">
    <h3 style="margin-bottom: 10px;">Settings</h3>
    <p>Groq API key (free)</p>
    <input type="text" id="apiKeyInput" placeholder="gsk_...">
    <p>Serper API key (free, for deep search)</p>
    <input type="text" id="serperKeyInput" placeholder="your serper key">
    <button onclick="saveKey()">Save Keys</button>
    <button class="closeBtn" onclick="closeSettings()">Cancel</button>
  </div>
</div>

<div id="chat"></div>

<div id="attachmentsPreview"></div>

<div id="inputRow">
  <input type="file" id="imageInput" accept="image/*" multiple style="display:none;" onchange="handleImageSelect(event)">
  <button class="iconBtn secondary" onclick="document.getElementById('imageInput').click()" title="Upload Images">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>

  <input type="file" id="pdfInput" accept="application/pdf,.txt" style="display:none;" onchange="handleDocumentSelect(event)">
  <button class="iconBtn secondary" onclick="document.getElementById('pdfInput').click()" title="Upload PDF/Text">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
  </button>

  <button class="iconBtn secondary" id="micBtn" onclick="startVoice()" title="Voice input">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>

  <input type="text" id="textInput" placeholder="Message Cyrus...">
  
  <button class="iconBtn" onclick="sendText()" title="Send">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script>
let mem = JSON.parse(localStorage.getItem('cyrus_mem')) || { name: null, history: [] };
let pendingImages = [];
let pendingDocText = "";
let pendingDocName = "";

function saveMem() { localStorage.setItem('cyrus_mem', JSON.stringify(mem)); }
function getKey() { return localStorage.getItem('cyrus_key'); }
function getSerperKey() { return localStorage.getItem('cyrus_serper_key'); }

function openSettings() {
  document.getElementById('apiKeyInput').value = getKey() || '';
  document.getElementById('serperKeyInput').value = getSerperKey() || '';
  document.getElementById('setup').style.display = 'flex';
}
function closeSettings() { document.getElementById('setup').style.display = 'none'; }

function saveKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  const sk = document.getElementById('serperKeyInput').value.trim();
  if (k) localStorage.setItem('cyrus_key', k);
  if (sk) localStorage.setItem('cyrus_serper_key', sk);
  document.getElementById('setup').style.display = 'none';
}

window.onload = function() {
  if (!getKey()) openSettings();
  mem.history.forEach(m => {
    if (typeof m.content === 'string') appendMsg(m.role === 'user' ? 'user' : 'bot', m.content);
  });
};

function handleImageSelect(e) {
  const files = Array.from(e.target.files).slice(0, 6);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(evt) {
      pendingImages.push(evt.target.result);
      renderPreviews();
    };
    reader.readAsDataURL(file);
  });
}

async function handleDocumentSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  pendingDocName = file.name;

  try {
    if (file.type === "application/pdf") {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = "";
      for (let i = 1; i <= Math.min(pdf.numPages, 15); i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ") + "\n";
      }
      pendingDocText = text;
    } else {
      pendingDocText = await file.text();
    }
  } catch(err) {
    alert("Could not extract file text: " + err.message);
  }
  renderPreviews();
}

function renderPreviews() {
  const panel = document.getElementById('attachmentsPreview');
  panel.innerHTML = "";
  if (pendingImages.length === 0 && !pendingDocText) {
    panel.style.display = "none";
    return;
  }
  panel.style.display = "flex";
  
  pendingImages.forEach((img, idx) => {
    const card = document.createElement('div');
    card.className = "preview-card";
    card.innerHTML = `<img src="${img}"> Image ${idx+1} <span class="remove" onclick="removeImage(${idx})">×</span>`;
    panel.appendChild(card);
  });

  if (pendingDocText) {
    const card = document.createElement('div');
    card.className = "preview-card";
    card.innerHTML = `📄 ${pendingDocName} <span class="remove" onclick="removeDoc()">×</span>`;
    panel.appendChild(card);
  }
}

function removeImage(idx) { pendingImages.splice(idx, 1); renderPreviews(); }
function removeDoc() { pendingDocText = ""; pendingDocName = ""; renderPreviews(); }
function clearAttachments() { pendingImages = []; pendingDocText = ""; pendingDocName = ""; renderPreviews(); }

function applyHighlighting(element) {
  if (window.hljs) {
    element.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
  }
}

function appendMsg(who, text, extraClass) {
  const div = document.createElement('div');
  div.className = 'msg ' + who + (extraClass ? ' ' + extraClass : '');
  if (who === 'bot') {
    div.innerHTML = marked.parse(text || '');
    applyHighlighting(div);
  } else {
    div.textContent = text;
  }
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = 999999;
  return div;
}

function renderFollowups(suggestions) {
  if (!suggestions || !suggestions.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'followups';
  suggestions.forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = s;
    chip.onclick = () => { wrap.remove(); process(s); };
    wrap.appendChild(chip);
  });
  document.getElementById('chat').appendChild(wrap);
  document.getElementById('chat').scrollTop = 999999;
}

async function searchWeb(query) {
  const key = getSerperKey();
  if (!key) return null;
  const res = await fetch("https://google.serper.dev/search", {
    method: "POST",
    headers: { "X-API-KEY": key, "Content-Type": "application/json" },
    body: JSON.stringify({ q: query })
  });
  return await res.json();
}

async function runDeepResearch(userQuery) {
  const statusMsg = appendMsg('bot', 'Running Deep Research...', 'searching');
  let searchResults = [];
  let links = [];

  const primary = await searchWeb(userQuery);
  if (primary && primary.organic) {
    primary.organic.slice(0, 3).forEach(r => {
      searchResults.push(`${r.title}: ${r.snippet}`);
      links.push({ title: r.title, link: r.link });
    });
  }

  statusMsg.remove();
  return { context: searchResults.join("\n\n"), links: links };
}

async function streamCyrusResponse(messages, botDiv) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + getKey(), "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "openai/gpt-oss-120b",
      messages: messages,
      stream: true,
      max_tokens: 1000
    })
  });

  if (!res.ok) throw new Error("Groq API error. Check API key.");

  const reader = res.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let fullText = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value);
    const lines = chunk.split("\n");
    for (const line of lines) {
      if (line.startsWith("data: ") && line !== "data: [DONE]") {
        try {
          const parsed = JSON.parse(line.substring(6));
          const content = parsed.choices[0]?.delta?.content || "";
          fullText += content;
          botDiv.innerHTML = marked.parse(fullText);
          document.getElementById('chat').scrollTop = 999999;
        } catch (e) {}
      }
    }
  }

  applyHighlighting(botDiv);
  return fullText;
}

async function analyzeMultipleImages(images, question) {
  const content = [{ type: "text", text: question || "Analyze these images." }];
  images.forEach(img => content.push({ type: "image_url", image_url: { url: img } }));

  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + getKey(), "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "qwen/qwen3.6-27b",
      messages: [{ role: "user", content: content }],
      max_tokens: 800
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.choices[0].message.content;
}

async function process(text) {
  if (!text.trim() && pendingImages.length === 0 && !pendingDocText) return;

  const currentText = text;
  const currentImages = [...pendingImages];
  const currentDoc = pendingDocText;
  const currentDocName = pendingDocName;
  clearAttachments();

  const userDiv = document.createElement('div');
  userDiv.className = 'msg user';

  if (currentDocName) {
    const docBadge = document.createElement('div');
    docBadge.className = 'doc-tag';
    docBadge.textContent = "📄 " + currentDocName;
    userDiv.appendChild(docBadge);
    if (currentText) userDiv.appendChild(document.createElement('br'));
  }

  if (currentText) userDiv.appendChild(document.createTextNode(currentText));
  
  if (currentImages.length) {
    const grid = document.createElement('div');
    grid.className = 'img-grid';
    currentImages.forEach(img => {
      const el = document.createElement('img'); el.src = img; grid.appendChild(el);
    });
    userDiv.appendChild(grid);
  }
  document.getElementById('chat').appendChild(userDiv);
  document.getElementById('chat').scrollTop = 999999;

  if (currentImages.length > 0) {
    const statusMsg = appendMsg('bot', `Analyzing images...`, 'searching');
    try {
      const reply = await analyzeMultipleImages(currentImages, currentText);
      statusMsg.remove();
      appendMsg('bot', reply);
      mem.history.push({ role: "user", content: currentText || "Image request" });
      mem.history.push({ role: "assistant", content: reply });
      saveMem();
    } catch (e) {
      statusMsg.remove();
      appendMsg('bot', "Vision processing error: " + e.message);
    }
    return;
 }

let systemPrompt = "You are Cyrus, a personal assistant built by Samuel. Be concise, direct, and factual.";

if (currentDoc) {
  systemPrompt += "\n\nCRITICAL INSTRUCTION: Document uploaded: " + currentDocName + "\n";
  systemPrompt += "Answer ONLY using this content:\n";
  systemPrompt += "--- DOCUMENT START ---\n";
  systemPrompt += currentDoc.slice(0, 10000) + "\n";
  systemPrompt += "--- DOCUMENT END ---";
}

const isDeepResearch = currentText.toLowerCase().includes("research") || currentText.toLowerCase().includes("search");
let searchLinks = [];

if (isDeepResearch && getSerperKey()) {
  const research = await runDeepResearch(currentText);
  systemPrompt += `\n\nSearch Results:\n${research.context}`;
  searchLinks = research.links;
}

// Clear memory slice when analyzing a doc to prevent old context leakage
const historySlice = currentDoc ? [] : mem.history.slice(-6);

const messages = [{ role: "system", content: systemPrompt }]
  .concat(historySlice)
  .concat([{ role: "user", content: currentText }]);

const botDiv = appendMsg('bot', '');
try {
  const finalReply = await streamCyrusResponse(messages, botDiv);
  
  if (searchLinks.length) {
    const linkDiv = document.createElement('div');
    linkDiv.className = 'linkList';
    searchLinks.forEach(l => {
      const a = document.createElement('a');
      a.href = l.link;
      a.textContent = "🔗 " + l.title;
      a.target = '_blank';
      linkDiv.appendChild(a);
    });
    botDiv.appendChild(linkDiv);
  }

  mem.history.push({ role: "user", content: currentText });
  mem.history.push({ role: "assistant", content: finalReply });
  saveMem();

  renderFollowups(["Explain further", "Summarize key points"]);

} catch (e) {
  botDiv.textContent = "Error: " + e.message;
}
}

function sendText() {
const input = document.getElementById('textInput');
const text = input.value;
input.value = '';
process(text);
}

document.getElementById('textInput').addEventListener('keypress', function(e) {
if (e.key === 'Enter') sendText();
});

function startVoice() {
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Recognition) { alert('Voice not supported.'); return; }
const micBtn = document.getElementById('micBtn');
const rec = new Recognition();
rec.lang = 'en-US';
micBtn.classList.add('listening');
rec.onresult = (e) => { process(e.results[0][0].transcript); };
rec.onend = () => micBtn.classList.remove('listening');
rec.onerror = () => micBtn.classList.remove('listening');
rec.start();
}
</script>

</body>
</html>
