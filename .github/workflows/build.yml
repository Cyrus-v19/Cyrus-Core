name: Build Cyrus APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin autoconf-archive pkg-config m4
          python3 -m pip install --upgrade "pip==23.3.2"
          python3 -m pip install --upgrade setuptools wheel
          python3 -m pip install "buildozer==1.5.0" cython

      - name: Build APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyrus-apk
          path: bin/*.apk
